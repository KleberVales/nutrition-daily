spring.datasource.url=jdbc:postgresql://localhost:5432/nutrition_daily
spring.datasource.username=nutrition_user
spring.datasource.password=nutrition_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=your-very-long-secret-key-that-is-at-least-32-characters-long-for-hs256
jwt.expiration=86400000